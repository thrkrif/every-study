# 운영(임시 HTTPS 포함) 배포 (PLAN T-013, ARCHITECTURE 9장: VM 1대 + Docker Compose).
# 서버의 배포 디렉토리(기본 ~/every-study)에 이 파일·Caddyfile·환경 파일을 두고 실행한다. 방법은 deploy/README.md.
# 이미지는 deploy.sh 가 빌드해 서버로 보낸다. 서버에서 빌드하지 않는다(작은 VM 메모리 보호).
name: every-study

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-every_study}
      MYSQL_USER: ${MYSQL_USER:?환경 파일에 MYSQL_USER 를 적으세요}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?환경 파일에 MYSQL_PASSWORD 를 적으세요}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql   # 백업·복구는 T-065
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    # 포트를 밖으로 열지 않는다. 백엔드만 Docker 네트워크로 접속한다

  backend:
    image: every-study-backend:latest
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-every_study}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?환경 파일에 JWT_SECRET 를 적으세요}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?환경 파일에 KAKAO_CLIENT_ID 를 적으세요}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?환경 파일에 KAKAO_CLIENT_SECRET 를 적으세요}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?환경 파일에 GOOGLE_CLIENT_ID 를 적으세요}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?환경 파일에 GOOGLE_CLIENT_SECRET 를 적으세요}
      FRONTEND_URL: https://app.${APP_DOMAIN:?환경 파일에 APP_DOMAIN 을 적으세요}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_DOMAIN: ${APP_DOMAIN}
      # 힙 상한. 2GB VM 에서 MySQL·프론트와 나눠 쓰도록 묶는다(지정하면 이미지의 MaxRAMPercentage 보다 우선)
      JAVA_TOOL_OPTIONS: -Xmx${BACKEND_HEAP:-512m}
    restart: unless-stopped

  frontend:
    image: every-study-frontend:latest
    restart: unless-stopped

  # HTTPS 를 끝내고 app.<도메인> → 프론트, api.<도메인> → 백엔드로 보낸다. 인증서는 Caddy 가 자동으로 받고 갱신한다
  caddy:
    image: caddy:2
    depends_on:
      - backend
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?환경 파일에 ACME_EMAIL(인증서 만료 알림을 받을 주소)을 적으세요}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 인증서. 지우면 다시 발급받는다
      - caddy-config:/config
    restart: unless-stopped

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
