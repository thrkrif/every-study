# 기본 8080 은 다른 로컬 프로젝트와 겹치기 쉬워 8090 을 쓴다. 환경변수 SERVER_PORT 가 있으면 그 값이 이긴다.
server:
  port: 8090

spring:
  application:
    name: every-study

  # 로컬 편의: backend/ 에서 실행하면 저장소 루트의 .env 를 읽는다. 파일이 없으면(운영, CI) 건너뛴다.
  # 같은 키의 환경변수가 있으면 환경변수가 이긴다.
  config:
    import: "optional:file:../.env[.properties]"

  # 접속 정보는 환경변수(또는 위 .env)로만 받는다. 키 이름은 저장소 루트의 .env.example 에 있다.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:every_study}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 로만 만든다 (ADR-0001)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # 시간은 UTC 로 저장한다 (ARCHITECTURE 5장)

  flyway:
    locations: classpath:db/migration

  # 소셜 로그인 (ADR-0002 결정 1). 앱 키는 환경변수로만 받는다.
  # 공급자 콘솔에 등록할 리다이렉트 URI: <백엔드 주소>/login/oauth2/code/kakao, .../google
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # scope 는 적지 않는다. 카카오는 scope 가 없으면 콘솔에 켜 둔 동의 항목만 묻는다.
            # 이메일(account_email)은 비즈 앱에서만 켤 수 있고, 꺼져 있으면 이메일 없이 가입된다 (PLAN D-9).
            # 여기에 account_email 을 적으면 항목이 꺼진 앱에서 로그인이 KOE205 로 실패한다.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid 를 빼서 ID 토큰 없이 사용자 정보 조회만 한다 (필요한 것은 식별값과 이메일뿐).
            scope: email
        provider:
          # 카카오는 Spring Security 기본 공급자 목록에 없어 주소를 직접 적는다.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

everystudy:
  auth:
    token:
      signing-key: ${JWT_SECRET}   # 32자 이상. 짧으면 기동하지 않는다
      access-ttl: 15m              # ADR-0002 확정 값
      refresh-ttl: 14d
    web:
      frontend-url: ${FRONTEND_URL:http://localhost:3000}
      # HTTPS 가 아닌 로컬에서 쿠키가 저장되지 않는 브라우저(Safari)를 쓸 때만 false 로 둔다.
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
      # 쿠키의 Domain. 로컬은 비운다. 배포에서 app.·api. 를 나누면 등록 도메인(예: example.com)을 넣어 프론트 JS 가 CSRF 쿠키를 읽게 한다 (ADR-0002)
      cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  # 정책 설정값 (ARCHITECTURE 4.9). 값의 원본은 PRD 다. 클라이언트는 GET /api/v1/meta/options 로 받는다.
  study:
    capacity-min: 2      # PRD 4.2 정원(주최자 포함)
    capacity-max: 6
    openable-days: 14    # PRD 4.2 개설 가능 범위
    # 입력 단위 (PRD 에 없음. PLAN D-21): 시작 10분 단위, 진행 30분 이상 10분 단위, 최소 출석률 선택지
    start-minute-unit: 10
    duration-minute-unit: 10
    duration-min-minutes: 30
    min-attendance-rate-options: 50, 60, 70, 80, 90, 100
    # 체크인 시간창 (PRD 4.6). 신청·대기는 체크인 오픈에 닫힌다 (PRD 4.14)
    checkin-opens-before-minutes: 10
    checkin-closes-after-minutes: 30
    # study 행 락 대기 시간 (ADR-0004 결정 5, 기본값의 원본은 ARCHITECTURE 4.2). 넘으면 409 LOCK_TIMEOUT
    lock:
      timeout: 3s
  attendance:
    checkin-radius-meters: 150   # PRD 4.6
  trust:
    newcomer-below-sessions: 3   # PRD 4.7 신규 배지: 집계 대상 세션이 3회 미만

# Swagger UI 에서 상태 변경 요청을 보낼 때 CSRF 쿠키 값을 헤더로 붙이게 한다 (개발용. 운영에서는 Swagger UI 가 꺼져 있다).
springdoc:
  swagger-ui:
    csrf:
      enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
