# 테스트 전용 값. classpath:/config/ 는 classpath:/ 의 application.yml 과 합쳐지고 같은 키는 이 파일이 이긴다.
# 모두 지어낸 값이다. 테스트는 실제 공급자에 접속하지 않는다 (공급자 호출은 가짜 구현으로 바꾼다).
spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-client-value
          google:
            client-id: test-google-client
            client-secret: test-google-client-value

everystudy:
  rate-limit:
    # 통합 테스트는 테이블을 비울 때마다 회원 ID 가 1 부터 다시 매겨지므로, 제한기의 횟수가 다른 테스트로 넘어가지 않게
    # 넉넉히 둔다. 제한 자체는 RateLimitIntegrationTest 가 낮은 값으로 덮어써 검증한다.
    checkin-code-per-minute: 100000
    join-per-minute: 100000
    report-per-hour: 100000
    chat-send-per-minute: 100000
    public-read-per-minute: 100000
  scheduler:
    enabled: false   # 스케줄 작업은 통합 테스트가 서비스를 직접 불러 검증한다
  auth:
    token:
      signing-key: test-only-signing-key-not-used-anywhere-else
    web:
      frontend-url: http://localhost:3000
      cookie-secure: true
