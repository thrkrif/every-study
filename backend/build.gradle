plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.everystudy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // ADR-0001
    }
}

repositories {
    mavenCentral()
}

// 패치 버전은 잠금 파일(gradle.lockfile)이 고정한다 (ADR-0001).
// 의존성을 바꾸면: ./gradlew dependencies --write-locks
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    // 소셜 로그인(OAuth2 로그인)과 자체 JWT 발급 (ADR-0002). JWT 인코더는 oauth2-client 가 가져오는 oauth2-jose 에 있다.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    // Spring Boot BOM 밖이라 버전을 직접 적는다. 3.x 가 Boot 4 호환 계열이다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // JUnit, AssertJ, Testcontainers 버전은 Spring Boot BOM 이 관리한다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    // 모듈 경계 검사 (ADR-0003). Spring Boot BOM 밖이라 버전을 직접 적는다.
    // JUnit 엔진 연동(archunit-junit5) 없이 코어만 쓰고, 규칙은 일반 JUnit 테스트에서 실행한다.
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트는 태그로 나눈다 (ARCHITECTURE 8.1).
//   test            단위·슬라이스. Docker 없이 빠르게 돈다.
//   integrationTest Testcontainers MySQL 을 쓰는 통합 테스트 (@Tag("integration")).
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Testcontainers 를 쓰는 통합 테스트를 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
